<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encuentro Fortuito</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Importmap para Three.js y sus addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Escena, Cámara y Renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const clock = new THREE.Clock();
        let mixer;

        // 2. Controles de Cámara
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.update();

        window.addEventListener('keydown', (event) => {
            const zoomInKeys = ['ArrowUp', 'ArrowRight'];
            const zoomOutKeys = ['ArrowDown', 'ArrowLeft'];

            if (zoomInKeys.includes(event.key)) {
                controls.dollyIn(0.85);
            } else if (zoomOutKeys.includes(event.key)) {
                controls.dollyOut(0.85);
            } else {
                return;
            }

            event.preventDefault();
            controls.update();
        });

        // 3. Iluminación básica
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        // 4. Cargar Entorno 360 (Imagen Equirectangular)
        const textureLoader = new THREE.TextureLoader();
        // Usar ruta relativa para que funcione en cualquier hosting (archivo en la misma carpeta)
        textureLoader.load('./MAPA_MUNDI_.jpg', (texture) => {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            texture.colorSpace = THREE.SRGBColorSpace;
            scene.background = texture;
            scene.environment = texture; // Ilumina el modelo con el entorno 360
        }, undefined, (err) => {
            console.error('Error al cargar la imagen 360:', err);
        });

        // 5. Cargar Modelo GLB
        const gltfLoader = new GLTFLoader();
        // Usar ruta relativa para que funcione en cualquier hosting (archivo en la misma carpeta)
        gltfLoader.load('./Encuentro_fortuito.glb', (gltf) => {
            const model = gltf.scene;
            model.position.set(0, 0, 0);
            scene.add(model);

            if (gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                });
            }

            const bounds = new THREE.Box3().setFromObject(model);
            const size = bounds.getSize(new THREE.Vector3());
            const center = bounds.getCenter(new THREE.Vector3());
            const largestDimension = Math.max(size.x, size.y, size.z);
            const cameraDistance = largestDimension / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));

            camera.near = Math.max(largestDimension / 1000, 0.01);
            camera.far = Math.max(largestDimension * 100, 1000);
            camera.position.set(
                center.x + cameraDistance * 0.8,
                center.y + cameraDistance * 0.5,
                center.z + cameraDistance
            );
            controls.target.copy(center);
            controls.minDistance = largestDimension * 0.15;
            controls.maxDistance = largestDimension * 10;
            camera.updateProjectionMatrix();
            controls.update();
        }, undefined, (error) => {
            console.error('Error al cargar el GLB:', error);
        });

        // 6. Animación y Redimensionamiento
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
